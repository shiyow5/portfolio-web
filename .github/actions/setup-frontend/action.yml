name: Setup Frontend
description: Checkout, install Node, and run `npm ci` inside app/ with a shared cache.

inputs:
  node-version:
    description: Node version
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: npm ci --no-audit --no-fund
