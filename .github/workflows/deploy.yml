name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/actions/setup-frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    # Gate: only run once Cloudflare Pages is configured. Set the repo
    # variable CF_DEPLOY_ENABLED=true alongside the CLOUDFLARE_* secrets
    # (see docs/SETUP_CLOUDFLARE.md) to enable this job. Until then the
    # job is skipped (neutral), not failed.
    if: vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://shiyow.dev' }}
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate required config is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            if [ -z "${!key}" ]; then
              echo "Missing required configuration: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure these at Settings → Secrets/Variables (see docs/SETUP_CLOUDFLARE.md)."
            exit 1
          fi

      - name: Verify required CI workflows succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          required = {"Format Check", "Lint", "Test"}
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs"
              f"?head_sha={sha}&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response).get("workflow_runs", [])

          latest = {}
          for run in runs:
              name = run.get("name")
              if name not in required:
                  continue
              created = run.get("created_at", "")
              if created > latest.get(name, {}).get("created_at", ""):
                  latest[name] = run

          failures = []
          for name in sorted(required):
              run = latest.get(name)
              if run is None:
                  failures.append(f"{name}: no run found for {sha}")
                  continue
              status = run.get("status")
              conclusion = run.get("conclusion")
              if status != "completed" or conclusion != "success":
                  failures.append(
                      f"{name}: status={status!r} conclusion={conclusion!r} "
                      f"url={run.get('html_url')}"
                  )

          if failures:
              print("Deploy blocked — required CI not green on this commit:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print(f"All required CI passed for {sha}.")
          PY

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build
        working-directory: app
        env:
          # Public Turnstile site key — baked into the client bundle at build time
          # so the widget renders. Leave the variable unset to ship without Turnstile.
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
