name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Gemini Review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Skip when GEMINI_API_KEY is not configured
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "GEMINI_API_KEY not set — skipping. Configure it at Settings → Secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gemini AI Code Reviewer
        if: steps.guard.outputs.skip == 'false'
        uses: newlc/ai-code-reviewer@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-2.5-flash-lite
          language: ja
